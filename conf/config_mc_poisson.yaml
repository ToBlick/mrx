defaults:
  - _mc_poisson_schema
  - _self_
  - override hydra/launcher: submitit_slurm

hydra:
  run:
    dir: multirun_dice/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun_dice/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: n${n}_p${p}
  launcher:
    timeout_min: 60
    mem_gb: 40
    gpus_per_node: 1
    partition: ${oc.env:SLURM_PARTITION}
    account: ${oc.env:SLURM_ACCOUNT}
    setup:
      - "source ${oc.env:MRX_VENV,${oc.env:MRX_ROOT}/.venv}/bin/activate"
      - "export PYTHONPATH=${oc.env:MRX_ROOT} MRX_DTYPE=${oc.env:MRX_DTYPE,float64}"
