name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run ruff
      run: |
        pip install ruff==0.16.10
        ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      # The suite is XLA-compile-bound (4 cores run it as fast as 32), so
      # the persistent compilation cache is the main lever on wall time.
      # test/conftest.py points JAX at MRX_XLA_CACHE, so that is the variable to set.
      MRX_XLA_CACHE: ${{ github.workspace }}/.jax_cache
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml

    # The default `jax` wheel is the CPU build. Every file the suite reads is in the repository.
    - name: Install mrx
      run: pip install -e ".[test]"

    - name: Restore the XLA compilation cache
      uses: actions/cache@v4
      with:
        path: .jax_cache
        key: jax-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          jax-cache-${{ runner.os }}-

    - name: Run the test suite
      run: pytest

    # catches import and command-line drift of the scripts, which the suite does not run
    - name: The scripts start
      run: for f in scripts/*.py scripts/tutorials/*.py; do python "$f" --help > /dev/null; done

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          docs/requirements.txt

    - name: Install mrx and sphinx
      run: pip install -e . -r docs/requirements.txt

    - name: Build docs
      run: sphinx-build -b html -W --keep-going docs/source docs/build
