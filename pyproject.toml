[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mrx"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
description = "Differentiable 3D MHD equilibria without nested flux surfaces"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Tobias Blickhan", email = "tobias.blickhan@nyu.edu"},
]
keywords = [
    "plasma physics",
    "plasma",
    "magnetohydrodynamics",
    "force_balance",
    "mhd",
    "nuclear fusion reactor",
    "fusion",
    "stellarator",
    "vmec",
    "spec",
    "optimization",
    "Biot-Savart",
    "magnetostatics"
]
dependencies = [
    "numpy",
    "jax",
    "scipy",
    "matplotlib",
    "diffrax",
    "equinox",
    "h5py",
    "tyro",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# docs/source/concepts/testing_strategy.md. The slowest tests are reported, so the cost of the suite is
# measured rather than guessed.
addopts = "--durations=10"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# ruff's long-standing default rules, stated so that a newer ruff with a wider default set lints the same way
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The tutorials are VS Code cell scripts: imports follow the argument-parsing
# cell, so E402 is expected.
"scripts/tutorials/*.py" = ["E402"]

[tool.setuptools.dynamic]
version = {attr = "mrx.__version__"}

[tool.setuptools.packages.find]
include = ["mrx*"]

[tool.setuptools.package-data]
"mrx.diagnostics" = ["*.mplstyle"]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "ruff"]
docs = ["sphinx", "myst-parser", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/ToBlick/mrx"
Download = "https://github.com/ToBlick/mrx"
Issues = "https://github.com/ToBlick/mrx/issues"
Repository = "https://github.com/ToBlick/mrx"