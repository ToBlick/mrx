[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrx"
version = "0.0.1"
license = {text = "MIT License"}
description="Differentiable 3D MHD equilibria without nested flux surfaces"
readme = "README.md"
# long_description = file: README.md
# long_description_content_type = text/markdown
requires-python = ">=3.11"
authors = [
  {name = "Tobias Blickhan", email = "tobias.blickhan@nyu.edu"},
]
keywords = [
    "plasma physics",
    "plasma",
    "magnetohydrodynamics",
    "force_balance",
    "mhd",
    "nuclear fusion reactor",
    "fusion",
    "stellarator",
    "vmec",
    "spec",
    "optimization",
    "Biot-Savart",
    "magnetostatics"
]
dependencies = [
    "numpy",
    "jax",
    "jaxlib",
    "scipy",
    "matplotlib",
    "ruff",
    "autopep8",
    "diffrax",
    "equinox",
    "h5py",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# One lean tier (test/conftest.py): one session sequence on the tracked li383
# wout, assembly / exactness / harmonic forms / four vacuum solves / one
# relaxation, plus a few millisecond checks. Every file it reads is in the
# repository. The slowest tests are reported so suite cost is measured rather
# than guessed; a new test is the production configuration plus at most one
# contrasting case.
addopts = "--durations=10"
norecursedirs = ["test/deprecated", "deprecated", "test/experimental"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# The package namespace is assembled from star imports on purpose.
"mrx/__init__.py" = ["F403"]

[tool.setuptools.packages.find]
include = ["mrx*"]

[tool.setuptools.package-data]
mrx = ["*.mplstyle"]

[project.optional-dependencies]
DOCS = ["sphinx", "myst-parser", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/ToBlick/mrx"
Download = "https://github.com/ToBlick/mrx"
Issues = "https://github.com/ToBlick/mrx/issues"
Repository = "https://github.com/ToBlick/mrx"