[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrx"
version = "0.0.1"
license = {text = "MIT License"}
description="Differentiable 3D MHD equilibria without nested flux surfaces"
readme = "README.md"
# long_description = file: README.md
# long_description_content_type = text/markdown
requires-python = ">=3.11"
authors = [
  {name = "Tobias Blickhan", email = "tobias.blickhan@nyu.edu"},
]
keywords = [
    "plasma physics",
    "plasma",
    "magnetohydrodynamics",
    "force_balance",
    "mhd",
    "nuclear fusion reactor",
    "fusion",
    "stellarator",
    "vmec",
    "spec",
    "optimization",
    "Biot-Savart",
    "magnetostatics"
]
dependencies = [
    "numpy",
    "jax",
    "jaxlib",
    "scipy",
    "matplotlib",
    "ruff",
    "autopep8",
    "diffrax",
    "equinox",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# One tier: `pytest` runs everything on the CPU (< 10 min on four cores,
# float64 and float32, no data files). Tests reading files outside the
# repository carry `needs_data` and skip when the file is absent; see
# slurm/README.md for running them. The slowest tests are reported so suite
# cost is measured rather than guessed.
addopts = "--durations=15"
markers = [
    "needs_data: reads a file outside the repository (MRX_W7X_FILE, MRX_RELAX_ARCHIVE); skips when it is absent",
]
norecursedirs = ["test/deprecated", "deprecated", "test/experimental"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# The package namespace is assembled from star imports on purpose.
"mrx/__init__.py" = ["F403"]

[tool.setuptools.packages.find]
include = ["mrx*"]

[project.optional-dependencies]
DOCS = ["sphinx", "myst-parser", "sphinx-rtd-theme"]
SLURM = ["hydra-core>=1.3", "hydra-submitit-launcher>=1.2", "h5py>=3.1.0"]

[project.urls]
Homepage = "https://github.com/ToBlick/mrx"
Download = "https://github.com/ToBlick/mrx"
Issues = "https://github.com/ToBlick/mrx/issues"
Repository = "https://github.com/ToBlick/mrx"